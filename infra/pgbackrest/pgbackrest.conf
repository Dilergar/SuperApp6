# ============================================================
# pgBackRest 2.5x — бэкапы PostgreSQL SuperApp6 (docs/operations_backup_dr.md)
# ============================================================
# Два репозитория в РАЗНЫХ городах (лучше — у разных провайдеров): потеря одного ДЦ или одного
# провайдера не уносит копии. Секреты — ТОЛЬКО переменными окружения сервиса бэкапа, не в файле:
#   PGBACKREST_REPO1_S3_KEY / PGBACKREST_REPO1_S3_KEY_SECRET / PGBACKREST_REPO1_CIPHER_PASS
#   PGBACKREST_REPO2_S3_KEY / PGBACKREST_REPO2_S3_KEY_SECRET / PGBACKREST_REPO2_CIPHER_PASS
# Пароли шифрования — из отдельной иерархии ключей (церемония как у корня core/keys, копии
# офлайн «два из трёх»): потерянный пароль = нечитаемые бэкапы.
# Бакеты: версионирование + Object Lock governance 36 дней (> срока хранения 35 дней): ни
# вымогатель, ни ошибка оператора не удалят копии раньше срока.
# Расписание (systemd-таймеры хоста БД, infra/pgbackrest/backup.sh):
#   full — вс 01:00 · incr (блочные) — каждые 6 часов · verify — ежедневно 05:00 ·
#   restore-drill — ежедневно 06:00 (scratch-хост) · PITR-учение на случайную точку — еженедельно.

[global]
# ---- Город 1 ----
repo1-type=s3
repo1-s3-endpoint=s3.city1.example.kz
repo1-s3-region=kz-city1
repo1-s3-bucket=sa6-pgbackrest-city1
repo1-s3-uri-style=path
repo1-path=/superapp6
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=35
repo1-bundle=y
repo1-block=y

# ---- Город 2 ----
repo2-type=s3
repo2-s3-endpoint=s3.city2.example.kz
repo2-s3-region=kz-city2
repo2-s3-bucket=sa6-pgbackrest-city2
repo2-s3-uri-style=path
repo2-path=/superapp6
repo2-cipher-type=aes-256-cbc
repo2-retention-full-type=time
repo2-retention-full=35
repo2-bundle=y
repo2-block=y

# ---- Производительность и WAL ----
process-max=4
compress-type=zst
compress-level=3
start-fast=y
delta=y
archive-async=y
archive-push-queue-max=64GiB
archive-get-queue-max=4GiB
spool-path=/var/spool/pgbackrest

# ---- Логи: без значений данных (только имена файлов и сегментов WAL) ----
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[superapp6]
pg1-path=/var/lib/postgresql/18/main
pg1-port=5432
pg1-user=sa6_backup
pg1-database=superapp6
