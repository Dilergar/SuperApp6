# ============================================================
# PostgreSQL — архив WAL в pgBackRest (ТОЛЬКО production; подключается после superapp6.conf)
# ============================================================
# include_if_exists = '/etc/postgresql/postgresql.archive.conf'
# В разработке НЕ подключать: archive_mode без живого pgBackRest копит WAL на диске без конца.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=superapp6 archive-push %p'
# Потеря не больше минуты транзакций (RPO) даже в тихий час
archive_timeout = 60
max_wal_senders = 10
max_replication_slots = 10
# Отчётная реплика (Patroni): её долгие запросы не отменяются мгновенно и не тормозят primary
# hot_standby_feedback = off
# max_standby_streaming_delay = 15min
