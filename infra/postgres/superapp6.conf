# ============================================================
# SuperApp6 — настройки PostgreSQL 18 (docs/data_architecture.md)
# ============================================================
# Подключается строкой `include_if_exists = '/etc/postgresql/superapp6.conf'` в postgresql.conf
# (dev: init-скрипт infra/postgres/init/00-superapp6-conf.sh для нового тома; готовый том —
# команда из docs/dev_environment.md). Прод: тот же файл + infra/pgbackrest/postgresql.archive.conf.
# Значения, требующие рестарта (shared_preload_libraries, max_connections, max_locks_*), — после
# изменения `docker compose restart postgres`.

# ---- Сеть и аутентификация ----
listen_addresses = '*'                  # в контейнере; снаружи — только приватная сеть и PgBouncer
password_encryption = 'scram-sha-256'   # MD5 не принимается (pg_hba: scram-sha-256)
ssl_min_protocol_version = 'TLSv1.2'    # прод: ssl = on + сертификат (между ДЦ — только TLS)

# ---- Время: только UTC (utcTs()/ts(d) в сыром SQL — docs/api_conventions.md) ----
timezone = 'UTC'
log_timezone = 'UTC'

# ---- Соединения: бюджет — пулы PgBouncer + обслуживание + резерв, а не «клиенты» ----
max_connections = 200
superuser_reserved_connections = 5

# ---- Локи: партиционированные журналы трогают много листьев в одном плане ----
max_locks_per_transaction = 256
plan_cache_mode = auto                  # при ожиданиях LWLock:LockManager — force_custom_plan на роль

# ---- Хранение и WAL ----
default_toast_compression = lz4
wal_compression = zstd
max_slot_wal_keep_size = 50GB           # зависший слот не съест диск (GitLab 2017)
checkpoint_timeout = 15min
max_wal_size = 8GB
min_wal_size = 1GB

# ---- Наблюдаемость ----
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.max = 10000
pg_stat_statements.track = top
auto_explain.log_min_duration = '500ms'
auto_explain.sample_rate = 0.1
auto_explain.log_analyze = off          # ANALYZE исполняет план второй раз по времени
auto_explain.log_format = 'json'
track_io_timing = on
track_functions = pl

# ---- Логи БД без ПДн: значения параметров запросов не пишутся никогда ----
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_statement = 'ddl'
log_min_duration_statement = -1         # медленное ловит auto_explain (план без значений)
log_lock_waits = on
log_temp_files = 65536                  # kB: временные файлы > 64 МБ — сигнал work_mem
log_autovacuum_min_duration = '10s'
log_checkpoints = on
log_connections = off                   # прод: on на входе PgBouncer, не на каждом серверном соединении
log_line_prefix = '%m [%p] %q%u@%d '

# ---- Autovacuum: append-only журналы и очереди ----
autovacuum_max_workers = 6
autovacuum_naptime = 15s
autovacuum_freeze_max_age = 500000000
autovacuum_vacuum_cost_limit = 2000

# ---- Потолки по умолчанию (роли уточняют: db-roles.sql) ----
# statement_timeout / idle_in_transaction / transaction_timeout — НА РОЛИ приложения, не глобально:
# миграции, бэкап и обслуживающее подключение живут со своими.
idle_in_transaction_session_timeout = '10min'   # страховка для любых ролей без своей настройки
