;; ============================================================
;; PgBouncer — пул приложения, production (общие ключи — pgbouncer.common.ini)
;; ============================================================

[databases]
;; Адрес primary (Patroni: адрес лидера через DNS/HAProxy). Отчётная реплика — свой пул.
superapp6 = host=db-primary port=5432 dbname=superapp6

[pgbouncer]
%include /etc/pgbouncer/pgbouncer.common.ini

;; Пароли в пулере не хранятся: auth_query через SECURITY DEFINER-функцию (db-roles.sql,
;; часть 3); `sa6_pgbouncer_auth` — единственный пользователь auth_file.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = sa6_pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)

;; TLS: клиенты → пулер и пулер → база (между ДЦ — только TLS)
client_tls_sslmode = require
client_tls_key_file = /etc/pgbouncer/tls/server.key
client_tls_cert_file = /etc/pgbouncer/tls/server.crt
client_tls_protocols = tlsv1.2,tlsv1.3
server_tls_sslmode = verify-full
server_tls_ca_file = /etc/pgbouncer/tls/ca.crt

;; Консоль статистики (SHOW POOLS/STATS для метрик) — только роль мониторинга
stats_users = sa6_monitor
