;; ============================================================
;; PgBouncer — разработка (общие ключи — pgbouncer.common.ini; прод — pgbouncer.ini)
;; ============================================================

[databases]
superapp6 = host=postgres port=5432 dbname=superapp6

[pgbouncer]
%include /etc/pgbouncer/pgbouncer.common.ini

;; dev-роль приложения — суперпользователь образа: auth_query (NOT usesuper) её не пустит,
;; поэтому пароль лежит в userlist.dev.txt (тот же, что в docker-compose — секрета нет).
;; TLS в dev нет (localhost).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.dev.txt
stats_users = superapp
max_client_conn = 500
default_pool_size = 20
max_db_connections = 60
