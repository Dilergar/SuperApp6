;; ============================================================
;; PgBouncer — общие ключи секции [pgbouncer] (включается из pgbouncer.ini / pgbouncer.dev.ini)
;; ============================================================
;; Файл БЕЗ заголовков секций: повторный `[pgbouncer]` сбрасывает уже прочитанные значения,
;; поэтому обёртки открывают секцию сами и включают этот файл внутри неё.
;;
;; Режим ТРАНЗАКЦИЙ: соединение сервера отдаётся клиенту на транзакцию. Совместимость кода
;; (аудит — docs/data_architecture.md): session-advisory-локов нет (только `_xact_`), `SET` —
;; только `SET LOCAL`/`set_config(…, true)`, `LISTEN` нет. Всё сессионное (миграции, онлайн-DDL,
;; REINDEX CONCURRENTLY, роллап) ходит мимо пулера по `DIRECT_URL`.
;; Prisma — без `pgbouncer=true`: подготовленные выражения держит сам пулер
;; (`max_prepared_statements`).

listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

pool_mode = transaction
max_prepared_statements = 200

;; Бюджет: max_db_connections × инстансы пулера < max_connections базы − обслуживание − резерв
max_client_conn = 5000
default_pool_size = 40
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 3
max_db_connections = 120

;; Параметры запуска: search_path отслеживается (Prisma `schema=`), прочее — игнор
track_extra_parameters = IntervalStyle, search_path
ignore_startup_parameters = extra_float_digits

;; Таймауты: зависший клиент не держит серверное соединение
server_idle_timeout = 300
server_lifetime = 3600
query_wait_timeout = 30
client_idle_timeout = 0
idle_transaction_timeout = 60
server_connect_timeout = 5
server_login_retry = 3

;; Логи без ПДн: адреса и тексты запросов не пишутся
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

admin_users =
