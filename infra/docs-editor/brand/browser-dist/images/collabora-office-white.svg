<!--
  ЗАГЛУШКА (PLACEHOLDER). Заменяет логотип Collabora, который в оригинальной сборке
  подставляется как background-image из bundle.css и backstage.css.

  Имя файла НАРОЧНО оставлено оригинальным: на него ссылается CSS внутри собранного
  bundle.css, и переименование потребовало бы править минифицированный CSS — то есть
  патчить чужой файл вместо добавления своего. Здесь же мы просто кладём свой файл
  поверх, ничего не патча (MPL §3.3: новый файл — наш код).

  Содержимое нейтральное: силуэт документа, никакой марки. Свой логотип SuperApp6
  ставится ОТДЕЛЬНОЙ работой, и правильное место для него — штатные плейсхолдеры
  %BRANDING_CSS% / %BRANDING_JS% в cool.html, а не подмена этого файла.

  Размеры (viewBox 16.23 x 22) совпадают с оригиналом — иначе поедет вёрстка тулбара.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16.23" height="22" viewBox="0 0 16.23 22" fill="none">
  <path d="M2.6 1.4h7.4l4.2 4.2v15a1.2 1.2 0 0 1-1.2 1.2H2.6a1.2 1.2 0 0 1-1.2-1.2V2.6a1.2 1.2 0 0 1 1.2-1.2z"
        fill="#ffffff" fill-opacity="0.92"/>
  <path d="M10 1.4v3.4a1.2 1.2 0 0 0 1.2 1.2h3" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.1"/>
  <path d="M4.3 10.2h7.6M4.3 13.2h7.6M4.3 16.2h4.8" stroke="#5a6270" stroke-width="1.1" stroke-linecap="round"/>
