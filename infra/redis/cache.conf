# ============================================================
# Redis — роль КЭШ (`REDIS_CACHE_URL`; docs/data_architecture.md)
# ============================================================
# Только то, что пересобирается из базы: профили, роли, проверки прав и снимки тарифов под
# эпохами, политика и факты видимости, присутствие, кэши отчётов. Вытеснение под давлением
# памяти законно (allkeys-lfu держит горячее), персистентности нет — рестарт = пустой кэш.
# Читатель кэша обязан пережить промах и ошибку (→ база), запись — со сроком.

port 6379
bind 0.0.0.0
protected-mode yes
aclfile /usr/local/etc/redis-acl/users.acl

maxmemory 256mb
maxmemory-policy allkeys-lfu
maxmemory-samples 10

save ""
appendonly no

client-output-buffer-limit normal 0 0 0
client-output-buffer-limit pubsub 32mb 8mb 60

tcp-keepalive 60
timeout 0
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-user-del yes
latency-monitor-threshold 100

# Ключи и значения (ПДн) не попадают в лог сервера
hide-user-data-from-log yes

enable-debug-command no
enable-module-command no
enable-protected-configs no
