# ============================================================
# Redis — роль СОСТОЯНИЕ (`REDIS_URL`; docs/data_architecture.md)
# ============================================================
# Шина событий, локи, лимиты и окна детекций, эпохи прав и тарифов, надгробия, сокет-адаптер,
# idem-счётчики. Потеря ключа = ошибка корректности или безопасности → НЕ вытесняется,
# персистентен. Роль ключа объявляет реестр `redis:<семейство>` (core/lifecycle); страж
# verify-lifecycle.cjs проверяет, что ключ лежит в инстансе своей роли.
# Эксплуатация (хост): vm.overcommit_memory=1, Transparent Huge Pages off; maxmemory ≈ 50 % RAM —
# fork при BGSAVE / AOF-rewrite удваивает память.

port 6379
bind 0.0.0.0
protected-mode yes

# ACL (формат файла не допускает комментариев — пояснения здесь). Один файл на оба инстанса:
#   default      — прод: off (без имени и пароля не войти); dev: on без пароля — только для
#                  сторонних dev-компонентов (LiveKit делит dev-Redis) и ручной отладки;
#   sa6_app      — приложение: ТОЛЬКО перечень команд (`-@all` + `+команда`). Категории (+@read,
#                  +@write, +@all -@dangerous) не годятся: в Redis 8 они включают команды модулей
#                  (Search, JSON, TimeSeries, Bloom, vector sets) и каждую новую команду версии
#                  (BACKUP, HOTKEYS, INCREX, XNACK, массивы…) — права росли бы с обновлением сервера.
#                  KEYS / CONFIG / DEBUG / RESTORE (CVE-2026-25243) / MIGRATE / MODULE / FLUSH* / SORT
#                  в перечень не входят. Lua (EVAL: локи, лимитер) — внутри скрипта тот же перечень.
#                  Каналы — только `socket.io#*` (sharded pub/sub адаптера сокетов). Новая команда в
#                  коде → в перечень ОБОИХ файлов (users.dev.acl и users.acl.template — их сверяет
#                  check:lifecycle): dev ответит NOPERM раньше прода, CI — шагом redis-acl-denials.cjs.
#                  Пароль dev `sa6-dev-redis` (не секрет, как пароль dev-базы);
#   sa6_ops      — эксплуатация (прод): BGREWRITEAOF после стирания субъекта (AOF хранит
#                  удалённое до перезаписи), диагностика; вход только с бастиона;
#   sa6_monitor  — redis_exporter (прод): INFO/SLOWLOG/LATENCY + чтение метаданных потоков шины.
# Пароли — только хешем `#<sha256>` (прод: users.acl.template, хеши из хранилища секретов).
# Ротация: второй хеш рядом (`#new #old`), клиенты переключаются, старый снимается.
# Отдельный каталог: entrypoint образа правит права каталога конфига, только когда в нём один файл
aclfile /usr/local/etc/redis-acl/users.acl

# maxmemory — ТОЛЬКО флагом запуска (`--maxmemory …`): файл общий для dev и прода, а число —
# среды: dev — docker-compose.yml (512mb), прод — ≈ 50 % RAM хоста (fork при BGSAVE / AOF-rewrite
# удваивает память). Без потолка приложение пишет предупреждение на старте, verify-health красный.
maxmemory-policy noeviction

# Персистентность: AOF каждую секунду + RDB раз в час (48 ч копий — у бэкапа хоста)
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 3600 1

# Pub/Sub сокет-адаптера: медленный подписчик не раздувает память бесконечно
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 512mb 128mb 60
client-output-buffer-limit pubsub 64mb 16mb 60

tcp-keepalive 60
timeout 0
lazyfree-lazy-user-del yes
lazyfree-lazy-expire yes
latency-monitor-threshold 100
slowlog-log-slower-than 10000

# Ключи и значения (ПДн) не попадают в лог сервера: отчёты о сбоях, assert, verbose
hide-user-data-from-log yes

# Опасные поверхности закрыты и на уровне сервера (ACL режет их у приложения отдельно)
enable-debug-command no
enable-module-command no
enable-protected-configs no
