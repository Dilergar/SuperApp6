# CI: build everything + run the full verify-*.cjs e2e suite against real Postgres/Redis.
# The verify scripts are the project's test suite (all scripts/verify-*.cjs via glob — do not
# hardcode a count here, it drifts; all-green policy) — this job is
# the safety net the architecture review found missing (0 unit tests, lint = OOM'ing tsc).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Мажорная и минорная — те же, что в docker-compose.yml (PG18: uuidv7(), fast-path локов)
        image: postgres:18.6
        env:
          POSTGRES_USER: superapp
          POSTGRES_PASSWORD: superapp
          POSTGRES_DB: superapp6
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U superapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://superapp:superapp@localhost:5432/superapp6
      # Пулера в CI нет: прямой адрес = адрес пула (миграции идут по directUrl схемы)
      DIRECT_URL: postgresql://superapp:superapp@localhost:5432/superapp6
      # Redis — два инстанса с ACL, как в dev и проде: сьют ходит пользователем приложения
      REDIS_URL: redis://sa6_app:sa6-dev-redis@localhost:6379
      REDIS_CACHE_URL: redis://sa6_app:sa6-dev-redis@localhost:6380
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
      NODE_ENV: test
      PORT: '3001'

    steps:
      # Actions пинованы по SHA коммита (тег переписываем, коммит — нет: supply-chain), рантайм
      # у всех node24. Обновление — новый SHA и версия в комментарии рядом.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # страж документации сравнивает HEAD~1..HEAD

      # Redis — НЕ service-контейнер: сервисы стартуют до checkout и не видят конфигов репозитория.
      # Оба инстанса — как в docker-compose.yml: тот же образ (тег берётся оттуда, второго пина нет),
      # state.conf / cache.conf, пустой tmpfs вместо модулей образа и ACL users.dev.acl. Сьют ходит
      # пользователем sa6_app (перечень команд): команда вне перечня краснеет здесь, а не в проде.
      - name: Start Redis (state + cache)
        run: |
          image=$(grep -m1 -oE 'image: redis:[^[:space:]]+' docker-compose.yml | cut -d' ' -f2)
          echo "Redis image (docker-compose.yml): $image"
          for spec in state:6379 cache:6380; do
            role=${spec%%:*}; port=${spec##*:}
            docker run -d --name "redis-$role" -p "$port:6379" \
              --tmpfs /usr/local/lib/redis/modules:ro,size=4k \
              -v "$PWD/infra/redis/$role.conf:/usr/local/etc/redis/redis.conf:ro" \
              -v "$PWD/infra/redis/users.dev.acl:/usr/local/etc/redis-acl/users.acl:ro" \
              "$image" redis-server /usr/local/etc/redis/redis.conf --protected-mode no
          done
          for role in state cache; do
            for i in $(seq 1 30); do
              docker exec "redis-$role" redis-cli ping 2>/dev/null | grep -q PONG && break
              sleep 1
            done
            docker exec "redis-$role" redis-cli ping | grep -q PONG || { docker logs "redis-$role"; exit 1; }
          done

      # Версия pnpm — только из packageManager корневого package.json: второй источник
      # (`with: version`) action отвергает ошибкой «Multiple versions of pnpm specified»
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Пин версии — .nvmrc (Node 24 LTS); engines корня держит ту же нижнюю границу
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Механический страж документации: пути в доках существуют, каждый модуль и каждый
      # док стоят в индексе, env-переменные описаны и валидируются, таблица рёбер модулей
      # совпадает с импортами, новое ребро движок → фича запрещено. Без LLM, секунды.
      # Стоит ДО сборок: падать на протухшем доке дешевле, чем после 20 минут сьюта.
      - name: Docs drift guard
        run: node scripts/check-docs.cjs --since HEAD~1

      # Механический страж каталогов сообщений: файл неймспейса есть в КАЖДОЙ локали,
      # набор ключей en ⇔ kk ⇔ ru совпадает полностью, каждая фраза разбирается
      # ICU-парсером, плейсхолдеры и обязательные ветки plural не потеряны при
      # переводе. Пропущенный ключ показывает человеку сам ключ — и только на одном
      # языке, то есть глазами это не ловится. Секунды, без LLM и без сборок.
      - name: i18n catalogs guard
        run: node scripts/check-i18n.cjs

      # Страж реестра событий аналитики: у каждого события есть название и описание в
      # трёх каталогах, имена свойств без персональных данных (phone, iin, email, text…),
      # владелец = первый сегмент ключа, серверные факты не шлются из клиентов.
      - name: Analytics registry guard
        run: node scripts/check-analytics.cjs

      # Страж реестра журнала безопасности (core/audit): у каждого события заголовок и строка
      # в трёх каталогах, имена деталей без ПДн и секретов (ip, password, token…), категория =
      # префикс ключа, действия сотрудников платформы людям не показываются, окно ленты не
      # режут только pd/consents, у каждого живого ключа есть запись в API.
      - name: Security audit registry guard
        run: node scripts/check-audit.cjs

      # Страж правил видимости полей (core/visibility): реестр типов, каталоги, связь с ПДн,
      # утечки имён полей, провайдер + канарейка у каждого типа, Guarded у DTO.
      - name: Field visibility registry guard
        run: node scripts/check-visibility.cjs

      # Страж реестра жизненного цикла данных (core/lifecycle): у каждой модели, сырой таблицы,
      # профиля файлов и семейства ключей Redis есть политика; FK схемы = рёбра удаления;
      # длительности только сутками; «по закону» — с нормой; hold у юридических записей;
      # каталоги; манифест канареек; ратчет готовности к ячейкам (только сокращается).
      - name: Data lifecycle registry guard
        run: node scripts/check-lifecycle.cjs

      # Страж миграций без простоя: заголовок таймаутов, CONCURRENTLY — одним оператором файла,
      # без PARTITION OF / DEFAULT-партиций / int4-ключей / перезаписи больших таблиц.
      - name: Zero-downtime migrations guard
        run: node scripts/check-migrations.cjs

      - name: Build shared package
        run: pnpm --filter @superapp/shared build

      # Каталоги сообщений и форматтеры. Между shared (константы провода: список
      # локалей, имя cookie) и api-client — порядок несущий.
      - name: Build i18n package
        run: pnpm --filter @superapp/i18n build

      # Транспорт границы (axios + single-flight refresh + хелперы apiGet/apiPost).
      # Собирается ПОСЛЕ shared: конверт ответа (ApiOk) он берёт оттуда.
      - name: Build api-client package
        run: pnpm --filter @superapp/api-client build

      # SDK аналитики (очередь, личность устройства, транспорт keepalive). Типы берёт
      # из shared, поэтому после него; веб импортирует его dist.
      - name: Build analytics SDK
        run: pnpm --filter @superapp/analytics build

      - name: Prisma generate + migrate
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Build API
        working-directory: apps/api
        run: npx nest build

      - name: Typecheck web
        working-directory: apps/web
        run: npx tsc --noEmit

      # Механический страж исходящих запросов: голый `fetch` и сторонние HTTP-клиенты
      # в apps/api. Наружу ведут ровно две двери из src/shared/http — `safeFetch`
      # (адрес из данных, SSRF-щит) и `trustedFetch` (адрес из .env, сидекары).
      # Мимо них уже уезжал process-ai-client (SSRF, security-ревью 2026-07-25).
      # Отдельный скрипт, а не `pnpm lint`: тот у API = полный tsc и падает по памяти.
      - name: Lint API (страж исходящих)
        working-directory: apps/api
        run: npx eslint src

      # Механический страж границы API ↔ клиент: голые api.get/post/…, `res.data.data`
      # и нативные confirm/alert. Компилятор их не ловит — они его как раз и глушат.
      - name: Lint web (страж границы)
        working-directory: apps/web
        run: npx eslint src

      # Те же стражи в пакетах: `no-cyrillic-literal` бережёт shared (одна русская
      # подпись в реестре делает русскими сразу три клиента) и сам движок i18n.
      - name: Lint shared + i18n (страж мультиязычности)
        run: |
          pnpm --filter @superapp/shared lint:guard
          pnpm --filter @superapp/i18n lint:guard

      # The verify scripts read apps/api/.env directly — give them the CI connection strings.
      # VOICE_STT_MOCK=true — голосовой движок на mock-драйвере: verify-voice.cjs
      # гоняет полный пайплайн транскрипции без whisper-контейнера и сети.
      # VERIFY_TEST_PHONES — тест-карта движка подтверждений: verify-otp.cjs проверяет
      # на ней ресенд без кулдауна (иначе блок помечается SKIP). Номера аккаунтов
      # СЬЮТА тоже в карте: подпись по ПЭП шлёт код на СВОЙ номер подписанта, и без
      # карты verify-sign.cjs упирался бы в анти-абьюз «5 SMS в час» на повторных
      # прогонах — падение не по делу.
      - name: Write apps/api/.env for verify scripts
        working-directory: apps/api
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "DIRECT_URL=$DIRECT_URL"
            echo "REDIS_URL=$REDIS_URL"
            echo "REDIS_CACHE_URL=$REDIS_CACHE_URL"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "NODE_ENV=test"
            echo "PORT=3001"
            echo "VOICE_STT_MOCK=true"
            echo "VERIFY_TEST_PHONES=+77099999999:424242,+77009990001:424242,+77009990002:424242,+77009990003:424242"
          } > .env

      - name: Start API
        working-directory: apps/api
        run: |
          node dist/main > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3001/api && break
            sleep 1
          done
          curl -s -o /dev/null http://localhost:3001/api || (echo "API did not start"; tail -50 api.log; exit 1)

      - name: Seed test accounts + card skins
        working-directory: apps/api
        run: |
          node scripts/seed-test-accounts.cjs
          node scripts/seed-card-skins.cjs

      - name: Run verify suite
        id: suite
        working-directory: apps/api
        run: |
          set -e
          failed=0
          for f in scripts/verify-*.cjs; do
            echo ""
            echo "════════ $f ════════"
            if ! node "$f"; then
              echo "::error::$f FAILED"
              failed=1
            fi
          done
          exit $failed

      # Отказы ACL пользователя приложения за весь прогон (ACL LOG обоих инстансов): команда вне
      # перечня в пути с .catch() не роняет сьют — деградирует молча, поэтому ловится здесь.
      - name: Redis ACL denials
        if: ${{ !cancelled() && steps.suite.conclusion != 'skipped' }}
        working-directory: apps/api
        run: node scripts/redis-acl-denials.cjs

      - name: API log on failure
        if: failure()
        working-directory: apps/api
        run: |
          tail -200 api.log || true
          docker logs redis-state 2>&1 | tail -30 || true

      - name: Stop API
        if: always()
        working-directory: apps/api
        run: kill "$(cat api.pid)" 2>/dev/null || true
