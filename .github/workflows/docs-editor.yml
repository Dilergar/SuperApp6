# Проверка движка документов ПРОТИВ НАШЕГО образа редактора.
#
# Зачем отдельно от ci.yml: основной прогон не задаёт DOCS_*, поэтому verify-docs.cjs
# там уходит в SKIP — это осознанно, чтобы каждый пуш не тянул двухгигабайтный образ.
# А здесь редактор поднимается по-настоящему, и сьют бьёт по живому WOPI.
#
# Собирать образ в CI НЕЛЬЗЯ: раннеры GitHub (2 vCPU / 7 ГБ / 14 ГБ диска) не вместят
# ни 413 МБ ассета движка, ни сборочное дерево. Образ собирается локально (см.
# infra/docs-editor/README.md) и просто скачивается отсюда.
name: Docs editor

on:
  workflow_dispatch:
  schedule:
    # Ночью: ловим расхождение с upstream или протухший образ до того, как оно
    # всплывёт при выкатке.
    - cron: '0 22 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Та же версия, что в ci.yml и docker-compose.yml: миграции требуют PG18 (uuidv7())
        image: postgres:18.6
        env:
          POSTGRES_USER: superapp
          POSTGRES_PASSWORD: superapp
          POSTGRES_DB: superapp6
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U superapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://superapp:superapp@localhost:5432/superapp6
      # Пулера в CI нет: прямой адрес = адрес пула (миграции идут по directUrl схемы)
      DIRECT_URL: postgresql://superapp:superapp@localhost:5432/superapp6
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
      NODE_ENV: test
      PORT: '3001'

    steps:
      # Actions пинованы по SHA коммита, рантайм node24 (как в ci.yml)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read image pin
        id: pins
        run: |
          set -a; . infra/docs-editor/pins.env; set +a
          echo "image=$REGISTRY/${IMAGE_BRAND#*/}:$BASE_TAG-b$BRAND_REV" >> "$GITHUB_OUTPUT"

      # Пакет с образом обязан оставаться ПРИВАТНЫМ: публикация — это распространение
      # исполняемой формы, и тогда MPL-2.0 §3.2 требует отдавать исходники всех
      # изменённых файлов Collabora. Подробности — infra/docs-editor/LICENSING.md.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Редактор поднимаем обычным `docker run` в шаге, а НЕ через job-level `services:`:
      # сервис-контейнеры GitHub стартуют ДО checkout, то есть не увидели бы ни файлов
      # репозитория, ни возможности что-то из него смонтировать.
      #
      # Конфигурация — переменными окружения: ENTRYPOINT образа несёт --use-env-vars,
      # и coolwsd сам читает aliasgroup1 / extra_params / DONT_GEN_SSL_CERT.
      # 172.17.0.1 — шлюз docker-моста, то есть «хост-раннер» глазами контейнера
      # (аналог host.docker.internal на Docker Desktop).
      - name: Start docs editor
        run: |
          docker run -d --name docs-editor -p 9980:9980 \
            -e 'aliasgroup1=http://172\.17\.0\.1:3001' \
            -e 'extra_params=--o:ssl.enable=false --o:ssl.termination=false --o:welcome.enable=false --o:feedback.show=false' \
            -e DONT_GEN_SSL_CERT=true \
            -e username='' -e password='' \
            "${{ steps.pins.outputs.image }}"
          for i in $(seq 1 60); do
            curl -sf http://localhost:9980/hosting/discovery >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:9980/hosting/discovery >/dev/null \
            || (echo "::error::редактор не поднялся"; docker logs docs-editor | tail -50; exit 1)

      # Версия pnpm — из packageManager, Node — из .nvmrc (один источник с ci.yml)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }

      - name: Install + build
        run: |
          pnpm install --frozen-lockfile
          # Порядок несущий: shared → i18n → api-client (API собирается на их dist)
          pnpm --filter @superapp/shared build
          pnpm --filter @superapp/i18n build
          pnpm --filter @superapp/api-client build
          cd apps/api && npx prisma generate && npx prisma migrate deploy && npx nest build

      - name: Write apps/api/.env
        working-directory: apps/api
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "DIRECT_URL=$DIRECT_URL"
            echo "REDIS_URL=$REDIS_URL"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "NODE_ENV=test"
            echo "PORT=3001"
            echo "WEB_URL=http://localhost:3000"
            echo "DOCS_EDITOR_URL=http://localhost:9980"
            echo "DOCS_WOPI_PUBLIC_URL=http://172.17.0.1:3001"
          } > .env

      - name: Start API
        working-directory: apps/api
        run: |
          node dist/main > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3001/api && break; sleep 1; done
          curl -s -o /dev/null http://localhost:3001/api || (tail -50 api.log; exit 1)

      - name: Seed
        working-directory: apps/api
        run: node scripts/seed-test-accounts.cjs

      # Ждём 64/0 и НЕ SKIP: если движок вдруг сочтёт себя выключенным, скрипт
      # отрапортует успех, ничего не проверив, — поэтому ловим слово SKIP отдельно.
      - name: verify-docs
        working-directory: apps/api
        run: |
          node scripts/verify-docs.cjs | tee verify-docs.out
          grep -q 'SKIP' verify-docs.out && { echo "::error::verify-docs ушёл в SKIP — редактор не подхватился"; exit 1; } || true

      - name: Logs on failure
        if: failure()
        run: |
          tail -200 apps/api/api.log || true
          docker logs docs-editor 2>&1 | tail -100 || true

      - name: Stop
        if: always()
        run: |
          kill "$(cat apps/api/api.pid)" 2>/dev/null || true
          docker rm -f docs-editor 2>/dev/null || true
