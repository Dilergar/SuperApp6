version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: superapp6-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: superapp6
      POSTGRES_USER: superapp
      POSTGRES_PASSWORD: superapp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U superapp -d superapp6']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching, sessions, pub/sub
  redis:
    image: redis:7-alpine
    container_name: superapp6-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-совместимое объектное хранилище (files engine, FILES_DRIVER=s3).
  # Опциональный профиль: обычный `docker compose up -d` его НЕ стартует.
  # Запуск: docker compose --profile s3 up -d
  # Внутри контейнера файлы пишутся под UID 1000 — volume должен быть ему доступен.
  seaweedfs:
    image: chrislusf/seaweedfs:4.37
    container_name: superapp6-s3
    profiles: ['s3']
    restart: unless-stopped
    command: 'server -s3 -s3.port=8333 -dir=/data'
    ports:
      - '8333:8333'
    volumes:
      - seaweed_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:8333 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # Антивирус для файлового движка (FilesScanHook). Опциональный профиль:
  # запуск: docker compose --profile scan up -d
  # Первый старт долгий — clamd подтягивает базу сигнатур (минуты, ~1-2 ГБ RAM).
  # Затем задать в apps/api/.env: CLAMAV_HOST=localhost (CLAMAV_PORT=3310).
  clamav:
    image: clamav/clamav:1.4
    container_name: superapp6-clamav
    profiles: ['scan']
    restart: unless-stopped
    ports:
      - '3310:3310'
    environment:
      # поднимаем лимит потока до потолка размера файла движка (200 МБ)
      CLAMD_CONF_StreamMaxLength: '200M'
      CLAMD_CONF_MaxFileSize: '200M'
      CLAMD_CONF_MaxScanSize: '200M'
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'echo PING | nc -w 5 localhost 3310 | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # STT-сервер голосового движка (core/voice): OpenAI-совместимый Whisper
  # (faster-whisper) + диаризация спикеров. Опциональный профиль:
  # запуск: docker compose --profile voice up -d
  # Первый старт долгий — качается модель (start_period 300s). CPU-образ;
  # для GPU — тег hwdsl2/whisper-server:cuda + NVIDIA Container Toolkit.
  # Модель: WHISPER_MODEL=small (дев-дефолт; для качества ru/kk — large-v3-turbo).
  # Затем задать в apps/api/.env:
  #   VOICE_STT_URL=http://localhost:9000
  #   VOICE_STT_API_KEY=superapp6-voice-dev   (= WHISPER_API_KEY ниже; смени в проде!)
  whisper:
    image: hwdsl2/whisper-server
    container_name: superapp6-whisper
    profiles: ['voice']
    restart: unless-stopped
    ports:
      - '9000:9000'
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DIARIZATION: 'true'
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_API_KEY: ${WHISPER_API_KEY:-superapp6-voice-dev}
    volumes:
      - whisper_data:/var/lib/whisper
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs -H "Authorization: Bearer $$WHISPER_API_KEY" http://localhost:9000/v1/models || wget -q -O /dev/null --header "Authorization: Bearer $$WHISPER_API_KEY" http://localhost:9000/v1/models || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # SFU-сервер движка звонков (core/calls): LiveKit — WebRTC-комнаты уровня Google Meet
  # (simulcast/adaptive streams/Opus RED — техники устойчивости Meet из коробки).
  # Опциональный профиль: docker compose --profile calls up -d
  # Затем в apps/api/.env:
  #   LIVEKIT_URL=http://localhost:7880
  #   LIVEKIT_API_KEY=devkey
  #   LIVEKIT_API_SECRET=superapp6-calls-dev-secret-0123456789ab   (= LIVEKIT_DEV_SECRET ниже, ≥32 символов — иначе сервер не стартует; смени в проде!)
  #   LIVEKIT_EGRESS_DIR=./storage/egress   (запись звонков; = bind-mount egress ниже)
  # Второе устройство в LAN: LIVEKIT_NODE_IP=<IPv4 хоста из ipconfig> + firewall на 7880-7882.
  livekit:
    image: livekit/livekit-server:v1.13
    container_name: superapp6-livekit
    profiles: ['calls']
    restart: unless-stopped
    # --node-ip — ICE-кандидат, который сервер рекламирует браузеру (Docker-NAT);
    # 127.0.0.1 достаточно для одного ПК (dev), для телефона в Wi-Fi — LAN-IP хоста.
    command: --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - '7880:7880' # signaling WebSocket + HTTP API
      - '7881:7881' # WebRTC-over-TCP fallback
      - '7882:7882/udp' # ЕДИНЫЙ muxed UDP-порт медиа (диапазон портов на Docker-Windows не работает)
    environment:
      # redis ОБЯЗАТЕЛЕН для связки с egress (psrpc-координация): без блока redis
      # StartEgress отвечает «egress not connected», хотя сам контейнер жив
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          # Устойчивость к слабой сети: при заторе SFU ПАУЗИТ видео-треки, сохраняя
          # аудио (allow_pause в коде сервера по умолчанию false!) — механизм
          # «звук не виснет» Google Meet: видео замирает первым, разговор продолжается
          congestion_control:
            enabled: true
            allow_pause: true
        redis:
          address: redis:6379
        keys:
          devkey: ${LIVEKIT_DEV_SECRET:-superapp6-calls-dev-secret-0123456789ab}
        webhook:
          api_key: devkey
          urls:
            - http://host.docker.internal:3001/api/calls/livekit/webhook
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway' # Docker Desktop имеет из коробки; строка — для Linux-хостов
    # Dev-инструмент: имитация плохой сети (tc/netem) для проверки устойчивости звонков.
    # tc в Alpine-образе нет — поставить один раз в ЖИВОЙ контейнер (не переживает пересоздание):
    #   docker exec superapp6-livekit apk add --no-cache iproute2
    # Включить деградацию (потери+лаг server→browser; бьёт ВЕСЬ трафик контейнера, вкл. вебхуки — тесты короткие):
    #   docker exec superapp6-livekit tc qdisc add dev eth0 root netem delay 200ms 50ms loss 15%
    # Выключить: docker exec superapp6-livekit tc qdisc del dev eth0 root
    cap_add:
      - NET_ADMIN

  # Запись звонков (подсистема движка core/calls): LiveKit Egress пишет audio-only
  # RoomComposite → OGG в /out (bind-mount ./apps/api/storage/egress — его читает
  # хост-API и инжестит в core/files). Тот же профиль calls: без egress звонки
  # работают, но кнопка ⏺ скрыта (LIVEKIT_EGRESS_DIR в .env не задан).
  # egress_*-вебхуки шлёт сам livekit-server (egress репортит через redis).
  livekit-egress:
    image: livekit/egress:v1.9
    container_name: superapp6-egress
    profiles: ['calls']
    restart: unless-stopped
    # Chrome внутри образа использует /dev/shm — дефолтных 64МБ мало
    shm_size: '1gb'
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: devkey
        api_secret: ${LIVEKIT_DEV_SECRET:-superapp6-calls-dev-secret-0123456789ab}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
    volumes:
      - ./apps/api/storage/egress:/out
    depends_on:
      redis:
        condition: service_healthy

  # Редактор документов движка core/docs — WOPI-клиент поверх LibreOffice.
  # Опциональный профиль:
  #   docker compose --profile docs up -d
  # Затем в apps/api/.env:
  #   DOCS_EDITOR_URL=http://localhost:9980
  #   DOCS_WOPI_PUBLIC_URL=http://host.docker.internal:3001
  # ВАЖНО про два адреса: iframe грузит БРАУЗЕР (localhost:9980), а за содержимым
  # документа редактор ходит ИЗ КОНТЕЙНЕРА к нашему API (host.docker.internal:3001).
  # Перепутанные адреса = классическое «WOPI::CheckFileInfo failed».
  #
  # Образ — НАШ, собранный из исходников Collabora Online (MPL-2.0) и обезличенный:
  # готовый collabora/code не годится для продажи, потому что их БИНАРНИКИ идут на
  # дополнительных проприетарных условиях, а политика товарных знаков требует убирать
  # марки из изменённой сборки. Как собирается и как обновляется — infra/docs-editor/
  # (рунбук в README.md, обязанности в LICENSING.md, версии в pins.env).
  #
  # ПОСЛЕ КАЖДОЙ ПЕРЕСБОРКИ образа обязательно сбрасывать кэш discovery, иначе iframe
  # час стучится в 404 без единой ошибки на сервере (в адресе редактора зашит хэш
  # сборки, а DocsEditorClient кэширует его в Redis на час):
  #   .\infra\docs-editor\build.ps1 -Stage brand -FlushDiscovery
  #
  # Откат: вернуть сюда collabora/code:24.04.13.1.1 и сбросить тот же кэш.
  docs-editor:
    image: superapp6/docs-editor:26.04-52df04e-b1
    container_name: superapp6-docs-editor
    profiles: ['docs']
    restart: unless-stopped
    ports:
      - '9980:9980'
    environment:
      # Конфигурация переменными окружения работает и в своей сборке: ENTRYPOINT образа
      # несёт --use-env-vars, и сам coolwsd читает aliasgroup1..N, extra_params,
      # DONT_GEN_SSL_CERT, username/password, server_name (проверено по исходникам
      # wsd/COOLWSD.cpp). Раньше это разбирал entrypoint-скрипт образа CODE — поэтому
      # при переходе на свою сборку блок не пришлось переписывать.
      #
      # Хосты, которым редактор доверяет как WOPI-хосту (регэксп с экранированными
      # точками). host\.docker\.internal — наш API, как его видит контейнер.
      aliasgroup1: 'http://host\.docker\.internal:3001'
      # В dev редактор говорит ЧИСТЫМ http. Оба флага задаём явно: ssl.enable=false
      # выключает собственный TLS, а ssl.termination=false запрещает считать, что
      # впереди стоит https-прокси. С termination=true сервер раздаёт в discovery
      # https-адреса и строит wss-сокеты — браузер стучится TLS'ом в открытый порт,
      # в логе появляется «Looks like SSL/TLS traffic on plain http port», и документ
      # не открывается. В проде, где впереди реальный https-прокси, termination
      # возвращается в true (см. infra/docs-editor/prod.env.example).
      # (В исходниках дефолт termination = false; true был особенностью образа CODE,
      # чей entrypoint-скрипт его подставлял. В своей сборке пишем оба явно и не
      # зависим от того, кто какой дефолт считает разумным.)
      # Обезличивание штатными ручками конфига (это поддерживаемый путь, а не хак):
      #   brandProductName — имя продукта в интерфейсе;
      #   brandProductURL  — ссылка «о продукте»; ПУСТОЕ значение по описанию самого
      #                      конфига «makes disable the link». В поставке там стоит
      #                      https://www.collaboraonline.com — единственная чужая ссылка,
      #                      оставшаяся в сборке из исходников.
      # Экранов welcome/feedback и обращений к remote_config/remote_font_config в сборке
      # из исходников НЕТ вовсе (в образе CODE их включал entrypoint-скрипт) — проверено
      # по /etc/coolwsd/coolwsd.xml: welcome.enable уже false, блока feedback нет,
      # remote-адреса пустые. welcome.enable оставлен явным как страховка от смены дефолта.
      extra_params: --o:ssl.enable=false --o:ssl.termination=false --o:welcome.enable=false --o:user_interface.brandProductName=SuperApp6 --o:user_interface.brandProductURL=
      # Без пароля админ-консоль недоступна — в dev она и не нужна
      DONT_GEN_SSL_CERT: 'true'
      username: ''
      password: ''
    # ОЖИДАЕМЫЙ ШУМ В ЛОГЕ на старте: три ERR про «CLONE_NEWUSER unshare failed» и
    # «Failed to exec coolmount … needs CAP_SYS_ADMIN». Помощник coolmount готовит
    # песочницы через bind-mount, а CAP_SYS_ADMIN в дефолтный набор Docker не входит.
    # coolwsd сам откатывается на копирование файлов («Bind-Mounting fails and will be
    # disabled for this run») и работает нормально — verify-docs зелёный. Выдавать
    # контейнеру SYS_ADMIN ради тишины в логе не стоит: это заметное расширение прав
    # ради чуть более быстрой подготовки песочницы.
    # Штатный `--o:mount_jail_tree=false` этот шум НЕ убирает (проверено: до слияния
    # аргументов командной строки проба уже отработала), поэтому флаг здесь не стоит —
    # он создавал бы ложное впечатление, что вопрос закрыт.
    extra_hosts:
      - 'host.docker.internal:host-gateway' # Docker Desktop имеет из коробки; строка — для Linux-хостов
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9980/hosting/discovery > /dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  postgres_data:
  redis_data:
  seaweed_data:
  clamav_data:
  whisper_data:
